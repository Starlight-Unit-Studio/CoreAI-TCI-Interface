name: Image Service and Core Management Regression

on:
  pull_request:
    paths:
      - 'tools/image/image_service.py'
      - 'tools/image/pgen_profiles.py'
      - 'tools/image/ponpoke_encoders.py'
      - 'tools/image/adopt_pgen.py'
      - 'tools/image/adopt_spike.py'
      - 'api/pgen.php'
      - 'scripts/pgen-selftest.py'
      - 'scripts/pgen-selftest.php'
      - 'config/image/mara-image.json'
      - 'tools/image_spike/models.json'
      - 'compose.yaml'
      - 'api/image_gen.php'
      - 'api/image_work_diagnostic.php'
      - 'api/console_work_store.php'
      - 'js/coreui-work-events.js'
      - 'scripts/image-work-diagnostic-selftest.php'
      - 'scripts/work-events-selftest.php'
      - 'scripts/work-events-ui-selftest.js'
      - 'api/image_png_metadata.php'
      - 'scripts/image-gen-selftest.php'
      - 'api/image_png_metadata.php'
      - 'scripts/image-gen-selftest.php'
      - 'api/profile.php'
      - 'api/profile_store.php'
      - 'api/profile_media.php'
      - 'api/image_reference_consistency.php'
      - 'database/migrations/042_mara_profile_references.sql'
      - 'database/migrations/043_pgen_user_license.sql'
      - 'api/core_generator_license.php'
      - 'api/ai_settings.php'
      - 'scripts/profile-reference-selftest.php'
      - 'scripts/profile-modals-ui-selftest.cjs'
      - 'js/coreui-profile-editors.js'
      - 'js/coreui-profile-crop.js'
      - 'js/coreui-profile-stats.js'
      - 'js/settings.js'
      - 'settings.html'
      - 'css/settings.css'
      - 'api/core_generator_engine.php'
      - 'api/models.php'
      - 'js/coreui-core-mode.js'
      - 'scripts/generator-engine-selftest.php'
      - 'scripts/thinking-switch-ui-selftest.cjs'
      - 'scripts/image-service-selftest.py'
      - 'scripts/ensure-generator-core.py'
      - 'scripts/generator-core-selftest.py'
      - 'scripts/install.sh'
      - 'scripts/install-native.sh'
      - 'api/core_install.php'
      - 'api/user_settings.php'
      - 'js/coreui-core-install.js'
      - 'scripts/vision-management-removal-selftest.py'
      - 'app.html'
      - 'css/console.css'
      - 'js/console-gate.js'
      - 'scripts/preflight.sh'
      - 'scripts/preflight-native.sh'
      - 'config/nginx.conf.template'
      - 'config/runtime/nginx.conf.template'
      - '.github/workflows/image-service-regression.yml'
  push:
    branches: [main]
    paths:
      - 'tools/image/image_service.py'
      - 'api/image_gen.php'
      - 'api/image_work_diagnostic.php'
      - 'api/console_work_store.php'
      - 'js/coreui-work-events.js'
      - 'scripts/image-work-diagnostic-selftest.php'
      - 'scripts/work-events-selftest.php'
      - 'scripts/work-events-ui-selftest.js'
      - 'api/image_png_metadata.php'
      - 'scripts/image-gen-selftest.php'
      - 'api/image_png_metadata.php'
      - 'scripts/image-gen-selftest.php'
      - 'scripts/image-service-selftest.py'
      - 'scripts/vision-management-removal-selftest.py'
      - 'app.html'
      - '.github/workflows/image-service-regression.yml'

permissions:
  contents: read

jobs:
  image-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version rule against current main on this PR
        if: github.event_name == 'pull_request'
        run: |
          base_version="$(git show origin/main:VERSION | tr -d '\\r\\n')"
          python3 scripts/version-merge-check.py --base-version "$base_version"
      - name: Python syntax and offline image worker
        run: |
          python3 -m py_compile tools/image/image_service.py tools/image/pgen_profiles.py tools/image/ponpoke_encoders.py tools/image/adopt_pgen.py scripts/pgen-selftest.py scripts/image-service-selftest.py scripts/vision-management-removal-selftest.py scripts/ensure-generator-core.py scripts/generator-core-selftest.py
          python3 -I scripts/image-service-selftest.py
          python3 -I scripts/pgen-selftest.py
          python3 -I scripts/generator-core-selftest.py
      - name: Verify removal and retained standard generator
        run: python3 -I scripts/vision-management-removal-selftest.py
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, gd, curl
          coverage: none
      - name: Profile reference migrations and modal tests
        run: |
          php -l api/profile_store.php
          php -l api/profile.php
          php -l api/profile_media.php
          php -l api/image_reference_consistency.php
          php scripts/profile-reference-selftest.php
          node --check js/coreui-profile-editors.js
          node --check js/coreui-profile-crop.js
          node --check js/coreui-profile-stats.js
          node --check js/settings.js
          node scripts/profile-modals-ui-selftest.cjs
      - name: PHP, JavaScript, Bash syntax
        run: |
          php -l api/image_gen.php
          php -l api/image_png_metadata.php
          php scripts/image-gen-selftest.php
          php -l api/image_work_diagnostic.php
          php -l api/console_work_store.php
          php scripts/image-work-diagnostic-selftest.php
          php scripts/work-events-selftest.php
          node --check js/coreui-work-events.js
          node scripts/work-events-ui-selftest.js
          php -l api/image_png_metadata.php
          php scripts/image-gen-selftest.php
          php -l api/pgen.php
          php -l api/core_generator_license.php
          php -l api/ai_settings.php
          php scripts/pgen-selftest.php
          php -l api/core_install.php
          php -l api/core_generator_engine.php
          php -l api/models.php
          php scripts/generator-engine-selftest.php
          php -l api/user_settings.php
          php scripts/core-install-selftest.php
          node --check js/coreui-model-library.js
          node --check js/coreui-core-install.js
          node --check js/coreui-core-mode.js
          node scripts/thinking-switch-ui-selftest.cjs
          node scripts/core-install-ui-selftest.cjs
          bash -n scripts/install.sh scripts/install-native.sh scripts/preflight.sh scripts/preflight-native.sh
      - name: Static asset fingerprints and version metadata
        run: python3 scripts/cache-bust.py --verify
