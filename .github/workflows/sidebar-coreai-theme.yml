name: CoreAI Sidebar and Project Theme
on:
  pull_request:
    paths:
      - 'VERSION'
      - 'app.html'
      - 'js/console-app.js'
      - 'js/coreui-projects.js'
      - 'js/coreui-sidebar-fold.js'
      - 'css/coreui-sidebar-refresh.css'
      - 'css/coreui-project-theme.css'
      - 'css/coreui-softglass.css'
      - 'js/coreui-preferences.js'
      - 'js/settings.js'
      - 'settings.html'
      - 'css/console.css'
      - 'scripts/softglass-ui-selftest.cjs'
      - 'scripts/sidebar-sections-ui-selftest.cjs'
      - 'scripts/project-ui-selftest.cjs'
      - 'scripts/chat-lock-selftest.cjs'
      - 'js/coreui-chat-lock.js'
      - 'js/coreui-chat-menu.js'
      - 'api/console_media.php'
      - 'api/console_chat_lock_store.php'
      - 'docs/changelogs-txt/**'
      - '.github/workflows/sidebar-coreai-theme.yml'
  push:
    branches: ['feat/sidebar-pinned-sections-0-7-21']
permissions:
  contents: read
jobs:
  ui-and-version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check js/console-app.js
          node --check js/coreui-projects.js
          node --check js/coreui-preferences.js
          node --check js/settings.js
          node --check js/coreui-sidebar-fold.js
          node scripts/sidebar-sections-ui-selftest.cjs
          node scripts/softglass-ui-selftest.cjs
          node scripts/project-ui-selftest.cjs
          node --check js/coreui-chat-lock.js
          node --check js/coreui-chat-menu.js
          node scripts/chat-lock-selftest.cjs
      - name: Version and release contract
        run: |
          python3 scripts/version-merge-check.py --base-version 0.7.33
          python3 scripts/branding-license-selftest.py
          python3 scripts/cache-bust.py --verify || { python3 scripts/cache-bust.py; git diff -- index.html login.html app.html settings.html protocols.html admin/index.html; exit 1; }
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, gd, curl
          coverage: none
      - name: Existing composer regression tests
        run: |
          php -l api/console_media.php
          php -l api/console_chat_lock_store.php
          php -l api/console_sessions.php
          php -l api/account_security.php
          php -l scripts/reply-pipeline-selftest.php
          php -l scripts/frontend-regression-selftest.php
          php -l scripts/session-selftest.php
          php scripts/session-selftest.php
          php scripts/reply-pipeline-selftest.php
          php scripts/frontend-regression-selftest.php
