name: CoreAI Core Variants in Admin Management

on:
  pull_request:
    paths:
      - 'js/coreui-core-mode.js'
      - 'js/coreui-core-install.js'
      - 'api/core_tier_variants.php'
      - 'scripts/core-tier-variant-selftest.php'
      - 'scripts/core-install-ui-selftest.cjs'
      - 'css/console.css'
      - 'scripts/thinking-switch-ui-selftest.cjs'
      - 'scripts/core-tiers-selftest.php'
      - 'scripts/model-access-selftest.php'
      - 'api/model_catalog.php'
      - 'api/user_settings.php'
      - 'app.html'
      - 'VERSION'
      - '.github/workflows/core-variant-choice.yml'
  push:
    branches: [main]
    paths:
      - 'js/coreui-core-mode.js'
      - 'scripts/thinking-switch-ui-selftest.cjs'
      - 'scripts/core-install-ui-selftest.cjs'
      - 'api/core_tier_variants.php'
      - '.github/workflows/core-variant-choice.yml'

permissions:
  contents: read

jobs:
  model-variant-choice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          coverage: none
      - name: Syntax and exact Ollama selection
        run: |
          node --check js/coreui-core-mode.js
          node --check scripts/thinking-switch-ui-selftest.cjs
          node --check js/coreui-core-install.js
          node --check scripts/core-install-ui-selftest.cjs
          php -l api/core_tier_variants.php
          php -l api/ai_settings.php
          php -l api/user_settings.php
          php -l api/models.php
          php -l api/core_install.php
          php -l scripts/core-tier-variant-selftest.php
          php -l scripts/core-tiers-selftest.php
          php -l scripts/model-access-selftest.php
          node scripts/thinking-switch-ui-selftest.cjs
          node scripts/core-install-ui-selftest.cjs
          php scripts/core-tier-variant-selftest.php
          php scripts/core-tiers-selftest.php
          php scripts/model-access-selftest.php
      - name: Check version, branding and asset fingerprints
        run: |
          BASE_VERSION="$(git show origin/main:VERSION | tr -d '\r\n')"
          python3 scripts/version-merge-check.py --base-version "$BASE_VERSION"
          python3 scripts/branding-license-selftest.py
          python3 scripts/cache-bust.py --verify
