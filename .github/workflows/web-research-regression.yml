name: Progressive Websuche and Source Attribution

on:
  pull_request:
    paths:
      - 'api/chat.php'
      - 'api/console_web_research.php'
      - 'api/console_agent_loop.php'
      - 'scripts/agent-loop-selftest.php'
      - 'scripts/web-search-selftest.php'
      - 'scripts/progressive-web-search-selftest.php'
      - 'scripts/weather-live-selftest.php'
      - 'scripts/preflight.sh'
      - 'scripts/preflight-native.sh'
      - 'VERSION'
      - '.github/workflows/web-research-regression.yml'
  push:
    branches: [main]
    paths:
      - 'api/console_web_research.php'
      - 'api/console_agent_loop.php'
      - 'scripts/progressive-web-search-selftest.php'
      - 'scripts/weather-live-selftest.php'
      - '.github/workflows/web-research-regression.yml'

permissions:
  contents: read

jobs:
  progressive-web-research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none
      - name: PHP and preflight syntax
        run: |
          php -l api/chat.php
          php -l api/console_agent_loop.php
          php -l api/console_web_research.php
          php -l scripts/progressive-web-search-selftest.php
          php -l scripts/agent-loop-selftest.php
          php -l scripts/web-search-selftest.php
          bash -n scripts/preflight.sh scripts/preflight-native.sh
      - name: Web pagination and existing tool contracts
        run: |
          php scripts/progressive-web-search-selftest.php
          php scripts/web-search-selftest.php
          php scripts/weather-live-selftest.php
          php scripts/agent-loop-selftest.php
          php scripts/browser-routing-selftest.php
      - name: Release version and static asset fingerprints
        run: |
          BASE_VERSION="$(git show origin/main:VERSION | tr -d '\r\n')"
          python3 scripts/version-merge-check.py --base-version "$BASE_VERSION"
          python3 scripts/branding-license-selftest.py
          python3 scripts/cache-bust.py --verify
