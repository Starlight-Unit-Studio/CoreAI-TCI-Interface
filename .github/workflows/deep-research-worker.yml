name: Deep Research Worker Preflight
on:
  push:
    branches:
      - fix/deep-research-worker-selftest-0-7-41
  pull_request:
    paths:
      - 'tools/coreai_deep_research.py'
      - 'tools/coreai_research_quality.py'
      - 'tools/coreai_research_browser.py'
      - 'tools/ember_browse_worker.py'
      - 'scripts/deep-research-worker-selftest.py'
      - '.github/workflows/deep-research-worker.yml'
jobs:
  deep-research-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: python3 -m py_compile tools/coreai_deep_research.py tools/coreai_research_quality.py tools/coreai_research_browser.py tools/ember_browse_worker.py scripts/deep-research-worker-selftest.py
      - name: Run Deep Research worker selftest (show failure details)
        run: python3 scripts/deep-research-worker-selftest.py
      - name: Validate release contract
        run: |
          python3 scripts/version-merge-check.py --base-version 0.7.40
          python3 scripts/branding-license-selftest.py
          python3 scripts/cache-bust.py --verify || { python3 scripts/cache-bust.py; git diff -- index.html login.html app.html settings.html protocols.html admin/index.html; exit 1; }
