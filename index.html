  <script>
    var msgs = [
      'ARCHNET VERBINDUNG…',
      'MARA COREAI VERBINDEN…',
      'SICHERHEITSPROTOKOLL AKTIV…',
      'BEREIT.'
    ];
    var i = 0;
    var bar = document.getElementById('splashBar');
    var status = document.getElementById('splashStatus');
    var pct = 0;
    var iv = setInterval(function() {
      i++;
      pct = Math.min(100, Math.round((i / msgs.length) * 100));
      bar.style.width = pct + '%';
      if (i < msgs.length) {
        status.textContent = msgs[i];
      }
      if (i >= msgs.length) {
        clearInterval(iv);
        setTimeout(function() {
          location.href = 'login.html';
        }, 400);
      }
    }, 380);
  </script>
