<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />

  <title>CoreAI: TCI Interface - Admin Core</title>

  <meta http-equiv="refresh" content="0; url=../settings.html#admin-uebersicht" />
  <link rel="stylesheet" href="../css/console.css?v=0396917892177056426880940" />
  <link rel="stylesheet" href="../css/settings.css?v=0552346926317640519068604" />
  <script>
    (function () {
      var map = {overview: 'admin-uebersicht', users: 'admin-benutzer', runtime: 'admin-betrieb', memories: 'admin-memory',
        lore: 'admin-lore', logs: 'admin-protokoll', audit: 'admin-audit'};
      var tab = map[String(location.hash || '').replace(/^#/, '')] || 'admin-uebersicht';
      location.replace('../settings.html#' + tab);
    })();
  </script>
