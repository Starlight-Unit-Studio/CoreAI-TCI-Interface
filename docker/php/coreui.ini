upload_max_filesize = 256M
post_max_size = 260M
max_execution_time = 900
max_input_time = 900
memory_limit = 768M
max_file_uploads = 10
session.cookie_httponly = 1
session.use_strict_mode = 1
; 0.5.83: on the host (var/php_sessions), so an update does not log everyone out.
session.save_path = /var/www/coreui/var/php_sessions
expose_php = Off
display_errors = Off
log_errors = On
error_log = /var/www/coreui/logs/php-error.log
