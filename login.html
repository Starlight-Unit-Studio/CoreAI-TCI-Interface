<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Language" content="de-DE" />
  <meta name="language" content="de-DE" />
  <meta http-equiv="Accept-Language" content="de-DE, de;q=0.9, en;q=0.8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="application-name" content="CoreAI: TCI Interface" />
  <meta name="application-version" content="0.5.82" />
  <meta name="robots" content="noindex,nofollow" />
  <title>CoreAI: TCI Interface - Login</title>
  <link rel="stylesheet" href="./css/console.css?v=0396917892177056426880940" />
  <script src="./js/console-gate.js?v=0028776187158387701560913"></script>
  <script src="./js/coreui-preferences.js?v=0408182548343544002678570"></script>
  <script src="./js/coreui-captcha.js?v=0847946519843965556453703"></script>
</head>
<body>
  <div class="login-page" style="background-image:url('./images/login_background.webp')">
    <div class="login-overlay"></div>
    <div class="login-card">
      <div class="studio-mark studio-mark-login">
        <img class="logo" src="./images/starlight_unit_studios_logo_original.png" alt="Starlight Unit Studios" draggable="false" />
      </div>
      <div class="login-brand">COREAI:<span class="brand-product-part">TCI INTERFACE</span></div>
      <div class="login-brand-sub">QUANTUM SOFTWARE // N-73 // v0.5.82</div>

      <div class="login-field-group">
        <label for="email">E-MAIL</label>
        <input id="email" type="email" placeholder="name@domain.tld" autocomplete="username" required />
      </div>
      <div class="login-field-group" id="displayNameGroup" hidden>
        <label for="displayName">ANZEIGENAME (OPTIONAL)</label>
        <input id="displayName" type="text" maxlength="60" placeholder="So nennt dich Mara" autocomplete="nickname" />
      </div>
      <div class="login-field-group">
        <label for="password">PASSWORT</label>
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <div class="login-field-group" id="passwordRepeatGroup" hidden>
        <label for="passwordRepeat">PASSWORT WIEDERHOLEN (MIN. 8 ZEICHEN)</label>
        <input id="passwordRepeat" type="password" placeholder="••••••••" autocomplete="new-password" />
      </div>

      <div id="loginError" class="login-error" style="display:none"></div>

      <button id="loginBtn" type="button">EINLOGGEN</button>
      <button id="loginModeToggle" class="login-mode-toggle" type="button" hidden>NOCH KEIN KONTO? REGISTRIEREN</button>
      <button id="guestBtn" class="login-guest" type="button" hidden>ALS GAST CHATTEN</button>
      <div class="login-copyright">© 2023-2026 <strong>Patrick Schildgen</strong> · Starlight Unit Studios. Alle Rechte vorbehalten.</div>
    </div>
  </div>

  <script>
    // 0.5.77: "Registrieren" and "Als Gast chatten" only while the admin has them switched on.
    var mode = 'login';
    var toggle = document.getElementById('loginModeToggle');
    var guestBtn = document.getElementById('guestBtn');

    // Bereits eingeloggt? Direkt weiter.
    (function() {
      fetch('./api/auth.php?action=me', { credentials: 'include' })
        .then(function(r) { return r.json(); })
        .then(function(d) {
          if (d.ok && d.user_id) {
            location.replace('app.html');
          } else {
            if (d.registration_enabled === true) toggle.hidden = false;
            if (d.guest_enabled === true) guestBtn.hidden = false;
          }
        })
        .catch(function() {});
    })();

    function setMode(next) {
      mode = next;
      var register = mode === 'register';
      document.getElementById('displayNameGroup').hidden = !register;
      document.getElementById('passwordRepeatGroup').hidden = !register;
      document.getElementById('password').setAttribute('autocomplete', register ? 'new-password' : 'current-password');
      document.getElementById('loginBtn').textContent = register ? 'KONTO ERSTELLEN' : 'EINLOGGEN';
      toggle.textContent = register ? 'SCHON EIN KONTO? EINLOGGEN' : 'NOCH KEIN KONTO? REGISTRIEREN';
      hideError();
    }

    function showError(msg) {
      var el = document.getElementById('loginError');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function hideError() {
      document.getElementById('loginError').style.display = 'none';
    }

    // 0.5.79: Sicherheitspruefung (Captcha, ohne Dritte) vor Gast-Zugang und Registrierung.
    // Der Browser rechnet kurz eine signierte Aufgabe, der Knopf zeigt den Fortschritt.
    var CAPTCHA_ERRORS = {
      'captcha_required': 'Die Sicherheitsprüfung fehlt. Bitte noch einmal versuchen.',
      'captcha_invalid':  'Die Sicherheitsprüfung ist fehlgeschlagen. Bitte noch einmal versuchen.',
      'captcha_expired':  'Die Sicherheitsprüfung ist abgelaufen. Bitte noch einmal versuchen.',
      'captcha_reused':   'Die Sicherheitsprüfung wurde schon benutzt. Bitte noch einmal versuchen.',
      'captcha_unsolved': 'Die Sicherheitsprüfung ließ sich nicht lösen. Bitte Seite neu laden.'
    };
    function securityCheck(button) {
      return fetch('./api/auth.php?action=captcha', { credentials: 'include', cache: 'no-store' })
        .then(function(r) { return r.json(); })
        .then(function(task) {
          if (!task || !task.ok) throw new Error((task && task.error) || 'captcha_unavailable');
          if (!task.required) return null;
          if (!window.CoreAICaptcha) throw new Error('captcha_unsolved');
          button.textContent = 'SICHERHEITSPRÜFUNG…';
          return window.CoreAICaptcha.solve(task, function(progress) {
            button.textContent = 'SICHERHEITSPRÜFUNG ' + Math.min(99, Math.round(progress * 100)) + ' %';
          });
        });
    }

    function doRegister(retried) {
      var email = document.getElementById('email').value.trim();
      var pass  = document.getElementById('password').value;
      var again = document.getElementById('passwordRepeat').value;
      var name  = document.getElementById('displayName').value.trim();
      var btn   = document.getElementById('loginBtn');

      hideError();
      if (!email || !pass) { showError('Bitte E-Mail und Passwort eingeben.'); return; }
      if (pass.length < 8) { showError('Passwort zu kurz (min. 8 Zeichen).'); return; }
      if (pass !== again) { showError('Die Passwörter stimmen nicht überein.'); return; }

      btn.disabled = true;
      btn.textContent = 'ERSTELLE KONTO…';
      securityCheck(btn)
      .then(function(captcha) {
        btn.textContent = 'ERSTELLE KONTO…';
        return fetch('./api/auth.php?action=register', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: email, password: pass, display_name: name, captcha: captcha })
        });
      })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.ok) {
          location.replace('app.html');
          return;
        }
        if (/^captcha_(?:expired|reused|invalid)$/.test(String(d.error || '')) && retried !== true) {
          doRegister(true);
          return;
        }
        btn.disabled = false;
        btn.textContent = 'KONTO ERSTELLEN';
        var errMap = {
          'username_taken':        'Für diese E-Mail gibt es schon ein Konto. Bitte einloggen.',
          'registration_disabled': 'Die Registrierung ist gerade geschlossen.',
          'invalid_username':      'Ungültige E-Mail-Adresse.',
          'invalid_password':      'Passwort zu kurz (min. 8 Zeichen).',
          'rate_limited':          'Zu viele Versuche. Bitte warten.',
          'maintenance_mode':      'Wartungsmodus: gerade keine neuen Konten.'
        };
        Object.keys(CAPTCHA_ERRORS).forEach(function(k) { errMap[k] = CAPTCHA_ERRORS[k]; });
        if (d.error === 'registration_disabled') {
          toggle.hidden = true;
          setMode('login');
        }
        showError(errMap[d.error] || ('Fehler: ' + (d.error || 'unbekannt')));
      })
      .catch(function(err) {
        btn.disabled = false;
        btn.textContent = 'KONTO ERSTELLEN';
        showError(CAPTCHA_ERRORS[err && err.message] || 'Verbindungsfehler. Server nicht erreichbar.');
      });
    }

    function doGuest(retried) {
      hideError();
      guestBtn.disabled = true;
      guestBtn.textContent = 'STARTE GAST-ZUGANG…';
      securityCheck(guestBtn)
      .then(function(captcha) {
        guestBtn.textContent = 'STARTE GAST-ZUGANG…';
        return fetch('./api/auth.php?action=guest', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ captcha: captcha })
        });
      })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.ok) {
          location.replace('app.html');
          return;
        }
        if (/^captcha_(?:expired|reused|invalid)$/.test(String(d.error || '')) && retried !== true) {
          doGuest(true);
          return;
        }
        guestBtn.disabled = false;
        guestBtn.textContent = 'ALS GAST CHATTEN';
        var until = '';
        var retry = d.retry_at ? new Date(d.retry_at) : null;
        if (retry && !isNaN(retry.getTime())) {
          until = ' Wieder möglich ab ' + retry.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' Uhr.';
        }
        var errMap = {
          'guest_disabled':   'Der Gast-Zugang ist gerade geschlossen.',
          'guest_capacity':   'Gerade sind sehr viele Gäste da. Bitte später noch einmal versuchen.',
          'guest_network_exhausted': 'Die Gast-Nachrichten für dein Netzwerk sind für heute aufgebraucht.' + until + ' Mit einem eigenen Konto geht es sofort weiter.',
          'guest_daily_exhausted': 'Der Gast-Zugang ist für heute ausgelastet.' + until + ' Mit einem eigenen Konto geht es sofort weiter.',
          'banned':           'Dieser Gast-Zugang ist gesperrt.',
          'rate_limited':     'Zu viele Versuche. Bitte warten.',
          'maintenance_mode': 'Wartungsmodus: gerade kein Gast-Zugang.'
        };
        Object.keys(CAPTCHA_ERRORS).forEach(function(k) { errMap[k] = CAPTCHA_ERRORS[k]; });
        if (d.error === 'guest_disabled') guestBtn.hidden = true;
        showError(errMap[d.error] || ('Fehler: ' + (d.error || 'unbekannt')));
      })
      .catch(function(err) {
        guestBtn.disabled = false;
        guestBtn.textContent = 'ALS GAST CHATTEN';
        showError(CAPTCHA_ERRORS[err && err.message] || 'Verbindungsfehler. Server nicht erreichbar.');
      });
    }

    function doLogin() {
      if (mode === 'register') return doRegister();
      var email = document.getElementById('email').value.trim();
      var pass  = document.getElementById('password').value;
      var btn   = document.getElementById('loginBtn');

      hideError();

      if (!email || !pass) {
        showError('Bitte E-Mail und Passwort eingeben.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'VERBINDE…';

      fetch('./api/auth.php?action=login', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: email, password: pass })
      })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.ok) {
          location.replace('app.html');
        } else {
          btn.disabled = false;
          btn.textContent = 'EINLOGGEN';
          var errMap = {
            'invalid_credentials': 'E-Mail oder Passwort falsch.',
            'invalid_username':    'Ungültige E-Mail-Adresse.',
            'invalid_password':    'Passwort zu kurz (min. 8 Zeichen).',
            'rate_limited':        'Zu viele Versuche. Bitte warten.',
            'too_many_attempts':   'Zu viele falsche Passwörter für dieses Konto. Bitte in '
              + Math.max(1, Math.ceil((Number(d.retry_after) || 900) / 60)) + ' Minuten noch einmal versuchen.',
            'account_banned':      'Konto gesperrt.',
            'banned':              'Konto gesperrt.'
          };
          showError(errMap[d.error] || ('Fehler: ' + (d.error || 'unbekannt')));
        }
      })
      .catch(function(err) {
        btn.disabled = false;
        btn.textContent = 'EINLOGGEN';
        showError('Verbindungsfehler. Server nicht erreichbar.');
      });
    }

    document.getElementById('loginBtn').addEventListener('click', doLogin);
    toggle.addEventListener('click', function() { setMode(mode === 'register' ? 'login' : 'register'); });
    guestBtn.addEventListener('click', doGuest);
    document.getElementById('password').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        if (mode === 'register') document.getElementById('passwordRepeat').focus();
        else doLogin();
      }
    });
    document.getElementById('passwordRepeat').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doLogin();
    });
    document.getElementById('email').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') document.getElementById('password').focus();
    });
  </script>
</body>
</html>
